version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: folio_postgres_local
    environment:
      POSTGRES_USER: folio_user
      POSTGRES_PASSWORD: folio_password
      POSTGRES_DB: folio_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio_user"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

